<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VibeCut Desktop</title>
<style>
  body{margin:0;background:#0f1115;color:#e6e9ef;font:15px -apple-system,Segoe UI,Roboto,Arial,sans-serif}
  .wrap{max-width:900px;margin:0 auto;padding:28px 20px}
  h1{font-size:20px}.logo{color:#7aa2ff}
  .preview{aspect-ratio:16/9;background:#000;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#445}
  button{background:#7aa2ff;color:#0b0d12;border:0;border-radius:9px;padding:10px 16px;font-weight:700;cursor:pointer;margin-top:14px}
  .muted{color:#8b93a7;font-size:13px}
</style></head>
<body><div class="wrap">
  <h1><span class="logo">&#9670; VibeCut</span> Desktop <span class="muted">— Phase 0 spike</span></h1>
  <p class="muted">Reuses the shared engine for vibe-editing; the native wgpu preview + FFmpeg export
     are wired through Tauri. The &lt;video&gt; below is a placeholder for the native GPU surface.</p>
  <div class="preview" id="preview">native wgpu preview surface goes here (spec §11)</div>
  <button id="probe">Check FFmpeg</button>
  <div class="muted" id="status" style="margin-top:10px"></div>

  <!-- Reuse the JS engine from the browser Studio for vibe -> edit-model -->
  <script src="../../vibecut-web/vibecut.js"></script>
  <script>
    // Tauri v2 exposes the invoke API on window.__TAURI__ (or via @tauri-apps/api).
    var invoke = window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke;
    document.getElementById('probe').addEventListener('click', async function(){
      var s = document.getElementById('status');
      if(!invoke){ s.textContent = 'Run inside `npm run tauri dev` (Tauri API not present in a plain browser).'; return; }
      try { s.textContent = 'FFmpeg: ' + await invoke('probe_ffmpeg'); }
      catch(e){ s.textContent = 'FFmpeg check failed: ' + e; }
    });
    // Example: build an export argv from the engine and call run_export(args).
    // var r = VibeCut.edit(analysis, VibeCut.planFromText(prompt), null);
    // invoke('run_export', { args: [...] });
  </script>
</div></body></html>
