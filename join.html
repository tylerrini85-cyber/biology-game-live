<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join — Cellular Respiration Live</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .j-wrap { max-width: 480px; width: 100%; }
    .j-card {
      background: linear-gradient(180deg, #0e1d3a, #06091a);
      border: 2px solid #3a6fbf;
      border-radius: 14px;
      padding: 30px 36px;
      box-shadow: 0 0 40px rgba(80, 140, 255, 0.3);
    }
    .j-title { font-size: 28px; color: #7ec8ff; text-align: center; margin-bottom: 8px; }
    .j-sub { color: #aac; text-align: center; margin-bottom: 24px; font-size: 14px; }
    .text-input {
      width: 100%; box-sizing: border-box;
      padding: 16px 20px; font-size: 22px;
      background: rgba(40, 60, 100, 0.6);
      border: 2px solid #3a6fbf; border-radius: 8px;
      color: white; text-align: center;
      font-family: 'Courier New', monospace;
      letter-spacing: 4px;
    }
    .text-input.name { letter-spacing: 1px; }
    .text-input:focus { outline: none; border-color: #7ec8ff; }
    .j-error { color: #ff6c6c; text-align: center; min-height: 20px; margin-top: 8px; }
    .j-status { text-align: center; padding: 18px; color: #ffe27a; font-size: 18px; }
    .j-spinner {
      display: inline-block; width: 28px; height: 28px;
      border: 3px solid rgba(255,226,122,0.3); border-top-color: #ffe27a;
      border-radius: 50%; animation: spin 0.8s linear infinite;
      vertical-align: middle; margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="j-wrap">
    <a href="/" style="display:block; color:#7a8aa8; text-decoration:none; font-size:13px; margin-bottom:14px;">← Back to home (Host or Guest)</a>
    <div id="step-code" class="j-card">
      <h1 class="j-title">🎮 Join a game</h1>
      <p class="j-sub">Enter the game code from the host's screen</p>
      <input id="code-input" class="text-input" placeholder="0 0 0 0" maxlength="6" inputmode="numeric">
      <div id="code-error" class="j-error"></div>
      <button class="btn" id="code-submit" style="width:100%; margin-top:14px;">Next</button>
    </div>

    <div id="step-name" class="j-card" style="display:none;">
      <h1 class="j-title">👤 Your name</h1>
      <p class="j-sub">What name should appear on the leaderboard?</p>
      <input id="name-input" class="text-input name" placeholder="Your name" maxlength="20">
      <div id="name-error" class="j-error"></div>
      <button class="btn" id="name-submit" style="width:100%; margin-top:14px;">Join Game</button>
    </div>

    <div id="step-waiting" class="j-card" style="display:none;">
      <h1 class="j-title">⏳ Waiting for host...</h1>
      <p class="j-sub">You're in! The host will start the game soon.</p>
      <div class="j-status"><span class="j-spinner"></span>Waiting in lobby</div>
      <p style="text-align:center; color:#7a8aa8; font-size:13px;">
        You: <strong id="my-name"></strong> · Game code: <strong id="my-code"></strong>
      </p>
    </div>

    <div id="step-error" class="j-card" style="display:none;">
      <h1 class="j-title" style="color:#ff6c6c;">⚠ Disconnected</h1>
      <p id="error-msg" class="j-sub"></p>
      <button class="btn" style="width:100%;" onclick="location.href='/join'">Try again</button>
    </div>
  </div>

  <script>
    const stepCode = document.getElementById('step-code');
    const stepName = document.getElementById('step-name');
    const stepWaiting = document.getElementById('step-waiting');
    const stepError = document.getElementById('step-error');
    const codeInput = document.getElementById('code-input');
    const codeSubmit = document.getElementById('code-submit');
    const codeError = document.getElementById('code-error');
    const nameInput = document.getElementById('name-input');
    const nameSubmit = document.getElementById('name-submit');
    const nameError = document.getElementById('name-error');

    function show(step) {
      for (const s of [stepCode, stepName, stepWaiting, stepError]) s.style.display = 'none';
      step.style.display = 'block';
    }

    codeSubmit.addEventListener('click', async () => {
      const code = codeInput.value.trim();
      if (!/^\d{4,6}$/.test(code)) {
        codeError.textContent = 'Code must be 4-6 digits';
        return;
      }
      codeError.style.color = '#ccab78';
      codeError.textContent = 'Checking...';
      codeSubmit.disabled = true;
      try {
        const res = await fetch(`/api/check-code?code=${encodeURIComponent(code)}`);
        const data = await res.json();
        codeError.style.color = '#ff6c6c';
        if (!data.exists) {
          codeError.textContent = '✗ No active game with that code. Try again.';
          codeInput.value = '';
          codeInput.focus();
        } else if (data.gameOver) {
          codeError.textContent = '✗ That game has already ended. Try a different code.';
          codeInput.value = '';
          codeInput.focus();
        } else {
          codeError.textContent = '';
          sessionStorage.setItem('biolive_code', code);
          show(stepName);
          nameInput.focus();
        }
      } catch (err) {
        codeError.style.color = '#ff6c6c';
        codeError.textContent = 'Error reaching server. Try again.';
      } finally {
        codeSubmit.disabled = false;
      }
    });
    codeInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') codeSubmit.click(); });

    nameSubmit.addEventListener('click', () => {
      const name = nameInput.value.trim();
      if (!name) { nameError.textContent = 'Please enter a name'; return; }
      sessionStorage.setItem('biolive_name', name);
      // Send everything to play.html
      const code = sessionStorage.getItem('biolive_code');
      location.href = `/play?code=${encodeURIComponent(code)}&name=${encodeURIComponent(name)}`;
    });
    nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') nameSubmit.click(); });

    window.addEventListener('load', () => codeInput.focus());
  </script>
</body>
</html>
